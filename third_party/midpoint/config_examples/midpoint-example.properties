# midPoint Example Configuration Properties
#
# This file illustrates some common properties that might need to be configured.
# The actual configuration file might be named midpoint.properties, config.xml,
# or ctx-repo.xml and its location can vary (e.g., in a 'var' directory created by midPoint).
# Refer to the official midPoint documentation for the specific version you are using.

# --- Database Configuration (PostgreSQL Example) ---
# spring.datasource.url=jdbc:postgresql://localhost:5432/midpoint_db
# spring.datasource.username=midadmin
# spring.datasource.password=your_strong_password_here
# spring.datasource.driver-class-name=org.postgresql.Driver

# Example for Hibernate dialect (might be auto-detected or needed in some setups)
# spring.jpa.database-platform=org.hibernate.dialect.PostgreSQL95Dialect

# --- midPoint Home Directory ---
# midpoint.home=./var
# (This usually points to a directory where midPoint stores its variable data, logs, etc.)
# (It's often relative to the midPoint installation directory or an absolute path)

# --- Other Potential Configurations ---
# Logging levels, specific feature toggles, etc.
# logger.com.evolveum.midpoint.model=DEBUG
# logger.com.evolveum.midpoint.repo=DEBUG
