# A generic, minimal Alembic configuration file.
# For a real setup, 'alembic init' would generate this.

[alembic]
# path to migration scripts
script_location = src/db/migrations

# Template used to generate migration files
# file_template = %%(rev)s_%%(slug)s

# sys.path entries, comma separated
# prepend_sys_path = .

# Logging configuration
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %%(levelname)-5.5s [%%(name)s] %%(message)s
datefmt = %%H:%%M:%%S

# --- Database Connection ---
# Replace with your actual database URL
# This is the most important line to configure.
# Example for PostgreSQL:
sqlalchemy.url = postgresql://app_user:app_user_password@localhost:5432/app_db
# For development, you might use environment variables or a separate config.
